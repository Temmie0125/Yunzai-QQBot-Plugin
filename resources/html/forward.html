<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #e3e6ec;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        /* 靠左显示；手机端自然占满，桌面端限宽 */
        .container { width: 100%; max-width: 460px; padding: 18px 16px; }

        .msg {
            display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start;
        }
        .msg:last-child { margin-bottom: 0; }

        .avatar {
            width: 34px; height: 34px; border-radius: 6px;
            flex: 0 0 auto; margin-top: 3px;
            background: #d5d9e0;
        }

        .body { min-width: 0; max-width: calc(100% - 44px); }

        .nickname {
            font-size: 12px; color: #8a8f99; margin: 0 0 5px 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .bubble {
            display: inline-block; max-width: 100%;
            background: #fff; border-radius: 10px; padding: 10px 13px;
            font-size: 14px; color: #1f2329; line-height: 1.65;
            word-break: break-all; white-space: pre-wrap;
        }

        .bubble:empty { display: none; }

        .bubble .img {
            display: block; max-width: 100%; max-height: 300px;
            margin-top: 6px; border-radius: 8px;
        }
        .bubble .img:first-child { margin-top: 0; }

        .bubble .at { color: #4f6ef7; font-weight: 600; }

        /* 网页查看模式（url 链接）专用：媒体横幅与气泡右侧下载箭头 */
        a.img-link { display: inline-block; line-height: 0; cursor: zoom-in; }
        a.img-link .img { cursor: zoom-in; }
        .bubble audio, .bubble video {
            display: block; max-width: 100%; border-radius: 8px; background: #f2f3f5;
        }
        .bubble video { max-height: 360px; }
        .file-card {
            display: flex; align-items: center; gap: 10px;
            min-width: 220px; max-width: 100%; padding: 12px 14px;
            background: #f2f3f7; border-radius: 8px;
        }
        .file-icon { width: 34px; height: 34px; flex: 0 0 auto; }
        .file-name {
            flex: 1; min-width: 0; font-size: 13px; color: #1f2329;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-ext { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: #8a909b; letter-spacing: .3px; }
        a.dl-arrow {
            flex: 0 0 auto; align-self: flex-end; margin-left: 2px; margin-bottom: 8px;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #8a909b; text-decoration: none;
        }
        a.dl-arrow:hover { background: #d9dde5; color: #4f6ef7; }

        /* 图片灯箱：PC 弹窗缩放 / 手机全屏预览（QQ 风格） */
        #lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0, 0, 0, .92);
            display: flex; align-items: center; justify-content: center;
            touch-action: none; cursor: zoom-out;
        }
        #lightbox[hidden] { display: none; }
        #lb-img {
            max-width: 94vw; max-height: 94vh;
            user-select: none; -webkit-user-drag: none; will-change: transform;
        }
        .lb-close {
            position: fixed; top: 12px; right: 14px; z-index: 1;
            width: 36px; height: 36px; border: 0; border-radius: 50%;
            background: rgba(255, 255, 255, .15); color: #fff;
            font-size: 18px; line-height: 1; cursor: pointer;
        }
        .lb-close:hover { background: rgba(255, 255, 255, .28); }
        .lb-hint {
            position: fixed; left: 14px; bottom: 12px;
            font-size: 12px; color: rgba(255, 255, 255, .4);
        }
    </style>
</head>

<body>
    <!-- 灯箱与脚本置于页面最前：脚本在解析大体积正文（内联图片）之前就挂好事件委托，
         图片边加载边可点击，无需等整页加载完 -->
    <div id="lightbox" hidden>
        <button class="lb-close" title="关闭">✕</button>
        <span class="lb-hint">滚轮/双指缩放 · 拖动查看 · 点空白关闭</span>
        <img id="lb-img" alt="">
    </div>
    <script>
    (() => {
        const lb = document.getElementById("lightbox")
        const img = document.getElementById("lb-img")
        let scale = 1, tx = 0, ty = 0, startDist = 0, startX = 0, startY = 0

        const apply = () => { img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})` }
        const open = src => {
            img.src = src
            scale = 1; tx = ty = 0
            apply()
            lb.hidden = false
            document.body.style.overflow = "hidden"
        }
        const close = () => {
            lb.hidden = true
            img.src = ""
            document.body.style.overflow = ""
        }
        // 以指针/捏合中点为锚缩放（变换原点在图片中心，故按中心偏移量换算平移）
        const zoom = (k, cx, cy) => {
            const ns = Math.min(8, Math.max(1, scale * k))
            if (cx != null) {
                const r = lb.getBoundingClientRect()
                const fx = cx - (r.left + r.width / 2), fy = cy - (r.top + r.height / 2)
                const f = ns / scale
                tx = fx * (1 - f) + tx * f
                ty = fy * (1 - f) + ty * f
            }
            scale = ns
            if (scale === 1) tx = ty = 0
            apply()
        }

        // 拦截图片点击：QQ 内置 webview 对 target=_blank 无反应，改为页内灯箱
        document.addEventListener("click", e => {
            const a = e.target.closest("a.img-link")
            if (a) {
                e.preventDefault()
                const im = a.querySelector("img")
                if (im) open(im.src)
            } else if (!lb.hidden && e.target === lb) {
                close()
            }
        })
        document.querySelector(".lb-close").addEventListener("click", close)
        document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) close() })

        lb.addEventListener("wheel", e => {
            e.preventDefault()
            zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY)
        }, { passive: false })

        // 双击：1x ↔ 2.5x 切换
        lb.addEventListener("dblclick", e => {
            e.preventDefault()
            if (scale > 1) { scale = 1; tx = ty = 0; apply() }
            else zoom(2.5, e.clientX, e.clientY)
        })

        // 触摸：双指捏合缩放（锚定中点）、单指拖动
        lb.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY
            } else if (e.touches.length === 2) {
                startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY)
            }
        }, { passive: true })
        lb.addEventListener("touchmove", e => {
            e.preventDefault()
            if (e.touches.length === 2 && startDist > 0) {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY)
                if (d > 0) {
                    zoom(d / startDist, (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        (e.touches[0].clientY + e.touches[1].clientY) / 2)
                    startDist = d
                }
            } else if (e.touches.length === 1 && scale > 1) {
                tx += e.touches[0].clientX - startX
                ty += e.touches[0].clientY - startY
                startX = e.touches[0].clientX; startY = e.touches[0].clientY
                apply()
            }
        }, { passive: false })
        lb.addEventListener("touchend", () => { startDist = 0 })
    })()
    </script>
    <div class="container">{{@ html}}</div>
</body>

</html>
