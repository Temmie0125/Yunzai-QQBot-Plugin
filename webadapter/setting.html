<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQBot 设置</title>
    <style>
        :root {
            --accent: #4f6ef7;
            --accent-hover: #3a5af0;
            --bg: #f0f2f5;
            --card: #ffffff;
            --border: #e0e3e8;
            --field-border: #dcdfe6;
            --text: #1f2329;
            --text-secondary: #8a8f99;
            --danger: #f5483b;
            --ok: #21a366;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .app { min-height: 100vh; display: flex; flex-direction: column; }

        .topbar {
            flex: 0 0 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; background: var(--card); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }

        .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }

        .save-btn {
            height: 34px; padding: 0 18px; border: none; border-radius: 8px;
            background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; transition: background .15s;
        }
        .save-btn:hover { background: var(--accent-hover); }
        .save-btn:disabled { opacity: .5; cursor: default; }

        .topbar-actions { display: flex; align-items: center; gap: 10px; }
        .restart-btn {
            height: 34px; padding: 0 18px; border: 1px solid var(--danger); border-radius: 8px;
            background: var(--danger); color: #fff; font-size: 14px; cursor: pointer; transition: opacity .15s;
        }
        .restart-btn:hover { opacity: .85; }
        .restart-btn:disabled { opacity: .5; cursor: default; }

        .content { padding: 16px 18px 60px; max-width: 860px; margin: 0 auto; width: 100%; }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
        .section > h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }

        /* boolean 行 */
        .bool-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #f2f3f5;
        }
        .bool-row:last-child { border-bottom: none; }
        .bool-info { flex: 1; min-width: 0; padding-right: 12px; }
        .bool-info .name { font-size: 14px; }
        .bool-info .desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .bool-hint { font-size: 12px; color: #c8741a; margin-top: 4px; }

        /* 胶囊开关 */
        .pill-switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: 0 0 auto; }
        .pill-switch input { opacity: 0; width: 0; height: 0; }
        .pill-switch .slider {
            position: absolute; inset: 0; background: #dcdfe6; border-radius: 999px; transition: .2s; cursor: pointer;
        }
        .pill-switch .slider:before {
            content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
            background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }
        .pill-switch input:checked + .slider { background: var(--accent); }
        .pill-switch input:checked + .slider:before { transform: translateX(20px); }

        /* 机器人头像 */
        .bot-avatar { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto; border: 1px solid var(--border); object-fit: cover; }
        .bot-avatar-sm { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; border: 1px solid var(--border); object-fit: cover; }

        /* map 字段卡片 */
        .map-desc { font-size: 12px; color: var(--text-secondary); margin: -6px 0 10px; }

        .map-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; background: #fafbfc; border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 8px; font-size: 13px;
        }
        .map-item .k { font-weight: 600; min-width: 80px; }
        .map-item .v { flex: 1; color: var(--text); word-break: break-all; }
        .map-item .del {
            border: none; background: transparent; color: var(--danger); cursor: pointer; font-size: 13px; flex: 0 0 auto; padding: 0;
        }
        .map-item .edit {
            border: none; background: transparent; color: var(--accent); cursor: pointer; font-size: 13px; flex: 0 0 auto; padding: 0;
        }

        /* markdown_template 条目：横向显示 */
        .tpl-item .tpl-tags {
            flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
        }
        .tpl-tag {
            display: inline-block; background: #eef1fb; color: var(--accent);
            border-radius: 4px; padding: 2px 8px; font-size: 12px; font-family: monospace;
        }

        /* 灰虚线框 + 号 */
        .add-box {
            border: 1px dashed #c5c9d1; border-radius: 8px; padding: 10px;
            display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
            cursor: pointer; font-size: 13px; transition: background .15s;
        }
        .add-box:hover { background: #f6f7f9; }

        /* 添加表单 */
        .add-form { border: 1px dashed #c5c9d1; border-radius: 8px; padding: 12px; margin-top: 8px; display: none; }
        .add-form.show { display: block; }

        .form-row {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;
        }
        .form-row:last-child { margin-bottom: 0; }

        .add-form input[type="text"] {
            height: 32px; border: 1px solid var(--field-border); border-radius: 6px;
            padding: 0 10px; font-size: 13px; background: #fff; color: var(--text); outline: none;
        }
        .add-form input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79,110,247,.12);
        }

        .num-input {
            height: 32px; padding: 0 10px; border: 1px solid var(--border, #d0d5dd);
            border-radius: 6px; font-size: 13px; width: 90px; text-align: center;
            background: var(--input-bg, #fff); color: var(--text); outline: none;
        }
        .num-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,110,247,.12); }

        .add-form .mini {
            height: 32px; padding: 0 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; flex-shrink: 0;
        }
        .add-form .mini-ok { background: var(--accent); color: #fff; }
        .add-form .mini-cancel { background: #eef0f3; color: var(--text); }

        /* 自定义 botQQ 选择器 */
        .botqq-picker {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 160px;
            min-width: 130px;
        }
        .botqq-picker .botqq-avatar-preview {
            width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
            display: none;
        }
        .botqq-picker.filled .botqq-avatar-preview { display: block; }
        .botqq-picker .botqq-input {
            flex: 1; min-width: 0;
            height: 32px; border: 1px solid var(--field-border); border-radius: 6px;
            padding: 0 8px; font-size: 13px; background: #fff; color: var(--text);
            outline: none; transition: border-color .15s;
        }
        .botqq-picker .botqq-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79,110,247,.12);
        }
        .botqq-drop {
            position: absolute; top: 36px; left: 30px; right: 0;
            max-height: 200px; overflow-y: auto;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.1);
            z-index: 20; display: none;
        }
        .botqq-drop.show { display: block; }
        .botqq-option {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; cursor: pointer; font-size: 13px; transition: background .1s;
        }
        .botqq-option:hover { background: #f2f4fb; }
        .botqq-option .bot-avatar {
            width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
        }
        .botqq-option.empty { color: var(--text-secondary); cursor: default; font-style: italic; }
        .botqq-option.empty:hover { background: transparent; }

        /* ====== markdown_template 编辑表单 ====== */
        .tpl-form { border: 1px dashed #c5c9d1; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; overflow: hidden; }
        .tpl-form-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 8px; min-width: 0;
        }
        .tpl-form-row:last-child { margin-bottom: 0; }
        .tpl-form .mini {
            height: 32px; padding: 0 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; flex-shrink: 0;
        }
        .mini-ok { background: var(--accent); color: #fff; }
        .mini-cancel { background: #eef0f3; color: var(--text); }

        /* 参数区域 — padding 对齐第一行参数标签位置 */
        .tpl-param-area {
            padding-left: 168px;
        }
        .tpl-param-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 6px;
        }
        .tpl-param-label {
            width: 56px; flex-shrink: 0; font-size: 12px; color: var(--text-secondary); white-space: nowrap;
        }
        .tpl-param-inp {
            flex: 1 1 120px; min-width: 100px; max-width: 220px;
            height: 32px; border: 1px solid var(--field-border); border-radius: 5px;
            padding: 0 8px; font-size: 13px; background: #fff; color: var(--text); outline: none;
        }
        .tpl-param-inp:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79,110,247,.12);
        }
        .tpl-param-row .del {
            border: none; background: transparent; color: var(--danger);
            cursor: pointer; font-size: 13px; padding: 0;
        }
        .tpl-add-more {
            margin-left: 64px; /* 56px label + 8px gap */
            max-width: 220px;
            border: 1px dashed #c5c9d1; border-radius: 6px;
            padding: 5px 0; text-align: center; color: var(--accent);
            cursor: pointer; font-size: 13px; margin-bottom: 6px; transition: background .15s;
        }
        .tpl-add-more:hover { background: #f6f7f9; }

        .tpl-bottom-row {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;
        }

        /* 窄屏适配 */
        @media (max-width: 700px) {
            .tpl-param-area { padding-left: 8px; }
            .tpl-param-inp { max-width: none; min-width: 80px; }
            .tpl-add-more { margin-left: 64px; max-width: none; }
        }

        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
            background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 8px;
            font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50;
        }
        .toast.show { opacity: 1; }
        .loading { text-align: center; color: var(--text-secondary); padding: 40px 0; }
    </style>
</head>

<body>
    <div class="app">
        <div class="topbar">
            <h1>QQBot 设置</h1>
            <div class="topbar-actions">
                <button class="restart-btn" id="restartBtn">重启 Bot</button>
                <button class="save-btn" id="saveBtn" disabled>保存</button>
            </div>
        </div>
        <div class="content" id="content">
            <div class="loading">加载中…</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const WEB_BASE = new URLSearchParams(location.search).get("__webBase")
        const API = WEB_BASE + "/api/qqbot-config"
        console.log(API)
        let state = null
        let botQQList = []

        // markdown_template 编辑状态
        let tplEditing = null // null=正常, ""=添加新条目, "botQQ"=编辑该QQ的条目
        let textEditing = null // null=正常, {field, key}=编辑某个文本字段的条目

        const MAP_META = {
            rawButton: { label: "开启原生按钮", valueType: "bool", desc: "全局开启/关闭对应机器人原生按钮使用，未添加的机器人默认开启原生按钮，关闭会自动转换为mqqapi按钮" },
            bot_openid: { label: "bot自身openid", valueType: "text", desc: "机器人自身的openid，可在全量群艾特机器人自动获取，无需手动输入" },
            markdown: { label: "机器人markdown模板id", valueType: "text", desc: "机器人的markdown模板id，当选择使用模板时或触发兜底时会使用，当前默认使用原生markdown可不添加" },
            markdown_template: { label: "机器人markdown模板参数", valueType: "list", desc: "机器人markdown模板对应模板参数，需要按顺序输入，改换顺序会导致一些问题，当前默认使用原生markdown可不添加" },
        }
        const BOOLEAN_META = [
            { key: "toCallback", label: "全局回调按钮", desc: "自动发送按钮全局转换回调按钮" },
            { key: "hideGuildRecall", label: "隐藏频道撤回提示", desc: "撤回频道消息时不提示" },
            { key: "stream", label: "流式消息", desc: "私信全局使用流式消息" },
            { key: "smallbtn", label: "全局小按钮", desc: "全局使用小尺寸按钮样式" },
            { key: "fakemsg", label: "野收官发", desc: "野收官发全局开关，配合野收官发插件使用" },
            { key: "filter_bot_msg", label: "过滤机器人消息", desc: "忽略来自 bot 的消息" },
            { key: "filter_only_at_other_bot", label: "过滤纯艾特其他机器人", desc: "只艾特其他 bot 时过滤" },
            { key: "sandbox", label: "沙箱模式", desc: "开启 QQ 机器人沙箱环境（需重启后生效）" },
            { key: "newapi", label: "使用新API", desc: "开启后使用新版 API 接入 QQBot（需重启后生效）" },
            { key: "stat", label: "使用统计", desc: "按机器人记录每日使用人数/群数、留存与增减，并在 Web 控制台展示（需重启后生效）" },
        ]
        // 依赖沙箱状态显示提示的字段（使用沙箱时此选项不起作用）
        const SANDBOX_DEPENDENT = new Set(["newapi"])
        const NUMBER_META = [
            { key: "imageLength", label: "图片压缩阈值", desc: "超过此大小(MB)的图片将自动压缩", default: 3 },
            { key: "chunkSize", label: "流式分块大小", desc: "流式消息每块显示的字数", default: 2 },
            { key: "delay", label: "流式延迟", desc: "流式消息每块显示的间隔(毫秒)", default: 100 },
        ]

        function avatarUrl(qq) { return `http://q1.qlogo.cn/g?b=qq&nk=${qq}&s=640` }

        function toast(msg) {
            const t = document.getElementById("toast")
            t.textContent = msg; t.classList.add("show")
            clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800)
        }

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }

        function render() {
            const c = document.getElementById("content")
            let html = ""

            // boolean 区
            html += `<div class="section"><h2>基础设置</h2>`
            for (const f of BOOLEAN_META) {
                const checked = state.bools[f.key] ? "checked" : ""
                const hint = SANDBOX_DEPENDENT.has(f.key) && state.sandboxOn
                    ? `<div class="bool-hint" data-sandboxhint="${f.key}">注意：使用沙箱时此选项不起作用</div>`
                    : ""
                html += `<div class="bool-row"><div class="bool-info"><div class="name">${esc(f.label)}</div><div class="desc">${esc(f.desc)}</div>${hint}</div>
                    <label class="pill-switch"><input type="checkbox" data-bool="${f.key}" ${checked}><span class="slider"></span></label></div>`
            }
            // 数字字段
            for (const f of NUMBER_META) {
                const val = state.numbers[f.key] != null ? state.numbers[f.key] : f.default
                html += `<div class="bool-row"><div class="bool-info"><div class="name">${esc(f.label)}</div><div class="desc">${esc(f.desc)}</div></div>
                    <input type="number" data-num="${f.key}" value="${esc(String(val))}" class="num-input"></div>`
            }
            html += `</div>`

            // map 字段区
            for (const field of Object.keys(MAP_META)) {
                const meta = MAP_META[field]
                const items = state.maps[field] || {}
                const isTpl = field === "markdown_template"
                html += `<div class="section"><h2>${esc(meta.label)}</h2>
                    <div class="map-desc">${esc(meta.desc || "key 为机器人 QQ（self_id），可通过下方下拉选择")}</div>`
                const keys = Object.keys(items)

                if (isTpl) {
                    // ===== markdown_template 条目 + 编辑表单 =====
                    for (const k of keys) {
                        const params = Array.isArray(items[k]) ? items[k] : []
                        if (tplEditing === k) {
                            // 编辑模式：显示表单
                            html += renderTplForm(k, params)
                        } else {
                            // 显示模式
                            html += `<div class="map-item tpl-item">
                                <img class="bot-avatar-sm" src="${avatarUrl(k)}" onerror="this.style.display='none'" alt="">
                                <span class="k">${esc(k)}</span>
                                <div class="tpl-tags">`
                            for (const p of params) html += `<span class="tpl-tag">${esc(p)}</span>`
                            if (!params.length) html += `<span style="font-size:12px;color:var(--text-secondary)">暂无参数</span>`
                            html += `</div>
                                <button class="edit" data-edit-tpl="${esc(k)}">编辑</button>
                                <button class="del" data-del="${field}" data-k="${esc(k)}">删除</button>
                            </div>`
                        }
                    }
                    if (!keys.length && tplEditing !== "") {
                        html += `<div style="font-size:13px;color:var(--text-secondary);padding:6px 0">暂无设置</div>`
                    }
                    // 添加模式 or 添加按钮
                    if (tplEditing === "") {
                        html += renderTplForm("", [])
                    } else if (tplEditing === null) {
                        html += `<div class="add-box" data-add="${field}">＋ 添加 ${esc(meta.label)} 项</div>`
                    }
                } else if (meta.valueType === "bool") {
                    for (const k of keys) {
                        html += `<div class="map-item">
                            <img class="bot-avatar-sm" src="${avatarUrl(k)}" onerror="this.style.display='none'" alt="">
                            <span class="k">${esc(k)}</span><span class="v"></span>
                            <label class="pill-switch"><input type="checkbox" data-mapbool="${field}" data-k="${esc(k)}" ${items[k] ? "checked" : ""}><span class="slider"></span></label>
                            <button class="del" data-del="${field}" data-k="${esc(k)}">删除</button></div>`
                    }
                    if (!keys.length) html += `<div style="font-size:13px;color:var(--text-secondary);padding:6px 0">暂无设置</div>`
                    html += `<div class="add-box" data-add="${field}">＋ 添加 ${esc(meta.label)} 项</div>
                        <div class="add-form" data-form="${field}">
                            <div class="form-row">
                                <div class="botqq-picker" data-picker="${field}">
                                    <img class="botqq-avatar-preview" src="" alt="" onerror="this.style.display='none'">
                                    <input class="botqq-input" type="text" data-botqqinp="${field}" placeholder="选择或输入机器人qq" autocomplete="off">
                                    <div class="botqq-drop" data-botqqdrop="${field}"></div>
                                </div>
                                <label class="pill-switch"><input type="checkbox" data-formbool="${field}"><span class="slider"></span></label>
                                <button class="mini mini-ok" data-confirm="${field}" style="margin-left:auto">确定</button>
                                <button class="mini mini-cancel" data-cancel="${field}">取消</button>
                            </div>
                        </div>`
                } else {
                    for (const k of keys) {
                        if (textEditing && textEditing.field === field && textEditing.key === k) {
                            // 编辑模式：显示预填表单
                            html += `<div class="add-form show" data-form="${field}">
                                <div class="form-row">
                                    <img class="bot-avatar-sm" src="${avatarUrl(k)}" onerror="this.style.display='none'" alt="">
                                    <span class="k" style="min-width:120px">${esc(k)}</span>
                                    <input type="hidden" data-botqqinp="${field}" value="${esc(k)}">
                                    <input type="text" data-formval="${field}" value="${esc(String(items[k] || ""))}" placeholder="${field === "markdown" ? "模板ID" : field === "bot_openid" ? "机器人自身openid" : "值"}" style="flex:1;min-width:100px">
                                    <button class="mini mini-ok" data-confirm="${field}">确定</button>
                                    <button class="mini mini-cancel" data-cancel="${field}">取消</button>
                                </div>
                            </div>`
                        } else {
                            html += `<div class="map-item">
                                <img class="bot-avatar-sm" src="${avatarUrl(k)}" onerror="this.style.display='none'" alt="">
                                <span class="k">${esc(k)}</span><span class="v">${esc(String(items[k] || ""))}</span>
                                <button class="edit" data-edit="${field}" data-k="${esc(k)}">编辑</button>
                                <button class="del" data-del="${field}" data-k="${esc(k)}">删除</button></div>`
                        }
                    }
                    if (!keys.length && !(textEditing && textEditing.field === field)) html += `<div style="font-size:13px;color:var(--text-secondary);padding:6px 0">暂无设置</div>`
                    if (!textEditing || textEditing.field !== field) {
                        html += `<div class="add-box" data-add="${field}">＋ 添加 ${esc(meta.label)} 项</div>
                            <div class="add-form" data-form="${field}">
                                <div class="form-row">
                                    <div class="botqq-picker" data-picker="${field}">
                                        <img class="botqq-avatar-preview" src="" alt="" onerror="this.style.display='none'">
                                        <input class="botqq-input" type="text" data-botqqinp="${field}" placeholder="选择或输入机器人qq" autocomplete="off">
                                        <div class="botqq-drop" data-botqqdrop="${field}"></div>
                                    </div>
                                    <input type="text" data-formval="${field}" placeholder="${field === "markdown" ? "模板ID" : field === "bot_openid" ? "机器人自身openid" : "值"}" style="flex:1;min-width:100px">
                                    <button class="mini mini-ok" data-confirm="${field}">确定</button>
                                    <button class="mini mini-cancel" data-cancel="${field}">取消</button>
                                </div>
                            </div>`
                    }
                }
                html += `</div>`
            }

            c.innerHTML = html
            bindEvents()
        }

        // ---- 渲染 markdown_template 编辑/添加表单 ----
        function renderTplForm(botQQ, params) {
            const isEdit = botQQ !== ""
            const list = (params && params.length) ? params : [""]
            const firstParam = list[0] || ""
            const rest = list.slice(1)

            let h = `<div class="tpl-form" data-tplform="${isEdit ? esc(botQQ) : "__add__"}">
                <div class="tpl-form-row">`
            if (isEdit) {
                h += `<img class="bot-avatar-sm" src="${avatarUrl(botQQ)}" onerror="this.style.display='none'" alt="">
                    <span class="k" style="min-width:120px">${esc(botQQ)}</span>
                    <input type="hidden" data-botqqinp="markdown_template" value="${esc(botQQ)}">`
            } else {
                h += `<div class="botqq-picker" data-picker="markdown_template">
                    <img class="botqq-avatar-preview" src="" alt="" onerror="this.style.display='none'">
                    <input class="botqq-input" type="text" data-botqqinp="markdown_template" placeholder="选择或输入机器人qq" autocomplete="off">
                    <div class="botqq-drop" data-botqqdrop="markdown_template"></div>
                </div>`
            }
            // 第一个参数 + 确定取消在同一行
            h += `<span class="tpl-param-label">第1参数</span>
                    <input class="tpl-param-inp" type="text" value="${esc(firstParam)}" placeholder="参数 key">
                </div>`
            // 其余参数 + 添加按钮
            if (rest.length > 0) {
                h += `<div class="tpl-param-area" data-tpllist="">`
                for (let i = 0; i < rest.length; i++) {
                    h += `<div class="tpl-param-row">
                        <span class="tpl-param-label">第${i + 2}参数</span>
                        <input class="tpl-param-inp" type="text" value="${esc(rest[i])}" placeholder="参数 key">
                        <button class="del" data-tplparamdel="">×</button>
                    </div>`
                }
                h += `<div class="tpl-add-more" data-tpladdmore="">＋ 添加参数</div>
                    </div>`
            } else {
                // 没有任何多余参数时也保留一个空的 param-area 供后续添加
                h += `<div class="tpl-param-area" data-tpllist="">
                    <div class="tpl-add-more" data-tpladdmore="">＋ 添加参数</div>
                </div>`
            }
            h += `<div class="tpl-bottom-row">
                    <button class="mini mini-ok" data-confirm="markdown_template">确定</button>
                    <button class="mini mini-cancel" data-cancel="markdown_template">取消</button>
                </div>
            </div>`
            return h
        }

        function renumberAdded() {
            const listEl = document.querySelector("[data-tpllist]")
            if (!listEl) return
            const rows = listEl.querySelectorAll(".tpl-param-row")
            rows.forEach((r, i) => {
                const label = r.querySelector(".tpl-param-label")
                if (label) label.textContent = `第${i + 2}参数` // 第1参数在顶行
            })
        }

        function getTplBotQQ() {
            const inp = document.querySelector(`[data-botqqinp="markdown_template"]`)
            return inp ? inp.value.trim() : ""
        }

        // ---- 自定义 botQQ 下拉 ----
        function openBotQQDrop(input, drop) {
            const q = input.value.trim().toLowerCase()
            const filtered = q ? botQQList.filter(b => String(b).toLowerCase().includes(q)) : botQQList.slice()
            let opts = ""
            if (filtered.length === 0) {
                opts = `<div class="botqq-option empty">${q ? "无匹配，可手动输入" : "暂无可选机器人"}</div>`
            } else {
                for (const qq of filtered) {
                    opts += `<div class="botqq-option" data-botqq="${esc(qq)}">
                        <img class="bot-avatar" src="${avatarUrl(qq)}" onerror="this.style.display='none'">
                        <span>${esc(qq)}</span></div>`
                }
            }
            drop.innerHTML = opts
            drop.classList.add("show")
        }

        function closeAllDrops() {
            document.querySelectorAll(".botqq-drop.show").forEach(d => d.classList.remove("show"))
        }

        function updateAvatar(preview, qq) {
            preview.src = avatarUrl(qq); preview.style.display = ""
            preview.onerror = () => { preview.style.display = "none" }
        }

        function initAllBotQQPickers() {
            document.querySelectorAll(".botqq-picker").forEach(picker => {
                const input = picker.querySelector(".botqq-input")
                const drop = picker.querySelector(".botqq-drop")
                const preview = picker.querySelector(".botqq-avatar-preview")
                if (!input || !drop) return
                if (input._pickerInited) return
                input._pickerInited = true

                input.addEventListener("focus", () => { openBotQQDrop(input, drop) })
                input.addEventListener("click", () => { if (!drop.classList.contains("show")) openBotQQDrop(input, drop) })
                input.addEventListener("input", () => { openBotQQDrop(input, drop) })
                input.addEventListener("blur", () => {
                    setTimeout(() => {
                        const v = input.value.trim()
                        if (v && /^\d+$/.test(v)) {
                            picker.classList.add("filled")
                            if (preview) updateAvatar(preview, v)
                        } else {
                            picker.classList.remove("filled")
                            if (preview) preview.style.display = "none"
                        }
                    }, 150)
                })
                drop.addEventListener("mousedown", (e) => {
                    const opt = e.target.closest(".botqq-option")
                    if (!opt || opt.classList.contains("empty")) return
                    const qq = opt.dataset.botqq
                    if (qq) {
                        input.value = qq; picker.classList.add("filled")
                        if (preview) updateAvatar(preview, qq)
                        drop.classList.remove("show")
                    }
                })
            })
            if (!document._botqqGlobalBound) {
                document._botqqGlobalBound = true
                document.addEventListener("click", (e) => { if (!e.target.closest(".botqq-picker")) closeAllDrops() })
            }
        }

        // ---- 事件绑定 ----
        function bindEvents() {
            // boolean 开关
            document.querySelectorAll("[data-bool]").forEach(el => {
                el.addEventListener("change", () => {
                    const key = el.dataset.bool
                    state.bools[key] = el.checked
                    // 沙箱状态变化时，刷新依赖沙箱的提示
                    if (key === "sandbox") {
                        state.sandboxOn = el.checked
                        document.querySelectorAll("[data-sandboxhint]").forEach(h => h.remove())
                        for (const fk of SANDBOX_DEPENDENT) {
                            if (state.sandboxOn) {
                                const row = document.querySelector(`[data-bool="${fk}"]`).closest(".bool-row").querySelector(".bool-info")
                                if (row && !row.querySelector("[data-sandboxhint]")) {
                                    const d = document.createElement("div")
                                    d.className = "bool-hint"
                                    d.dataset.sandboxhint = fk
                                    d.textContent = "注意：使用沙箱时此选项不起作用"
                                    row.appendChild(d)
                                }
                            }
                        }
                    }
                })
            })
            // 数字字段
            document.querySelectorAll("[data-num]").forEach(el => {
                el.addEventListener("input", () => {
                    const v = parseFloat(el.value)
                    state.numbers[el.dataset.num] = isNaN(v) ? el.value : v
                })
            })
            document.querySelectorAll("[data-mapbool]").forEach(el => {
                el.addEventListener("change", () => { state.maps[el.dataset.mapbool][el.dataset.k] = el.checked })
            })

            // 删除整条 map 条目
            document.querySelectorAll("[data-del]").forEach(el => {
                el.addEventListener("click", () => {
                    delete state.maps[el.dataset.del][el.dataset.k]
                    tplEditing = null; textEditing = null; render()
                })
            })

            // markdown_template 编辑按钮
            document.querySelectorAll("[data-edit-tpl]").forEach(el => {
                el.addEventListener("click", () => {
                    tplEditing = el.dataset.editTpl
                    render()
                })
            })

            // 文本字段 编辑按钮
            document.querySelectorAll("[data-edit]").forEach(el => {
                el.addEventListener("click", () => {
                    textEditing = { field: el.dataset.edit, key: el.dataset.k }
                    render()
                })
            })

            // === markdown_template 表单操作 ===

            // 委托：删除参数行 / 添加参数（委托在 .tpl-form 上以覆盖动态元素）
            document.querySelectorAll(".tpl-form").forEach(form => {
                const paramArea = form.querySelector("[data-tpllist]")
                if (!paramArea) return
                form.addEventListener("click", (e) => {
                    const delBtn = e.target.closest("[data-tplparamdel]")
                    if (delBtn) {
                        const row = delBtn.closest(".tpl-param-row")
                        row.remove()
                        if (paramArea.querySelectorAll(".tpl-param-row").length === 0) {
                            // 至少保留一行空行在添加按钮前
                            const newRow = document.createElement("div")
                            newRow.className = "tpl-param-row"
                            newRow.innerHTML = `<span class="tpl-param-label">第2参数</span>
                                <input class="tpl-param-inp" type="text" value="" placeholder="参数 key">
                                <button class="del" data-tplparamdel="">×</button>`
                            paramArea.insertBefore(newRow, paramArea.querySelector(".tpl-add-more"))
                        }
                        renumberAdded()
                        return
                    }
                    const addBtn = e.target.closest("[data-tpladdmore]")
                    if (addBtn) {
                        const addMoreEl = addBtn
                        const row = document.createElement("div")
                        row.className = "tpl-param-row"
                        const nextIdx = paramArea.querySelectorAll(".tpl-param-row").length + 2 // 第1参数在顶行
                        row.innerHTML = `<span class="tpl-param-label">第${nextIdx}参数</span>
                            <input class="tpl-param-inp" type="text" value="" placeholder="参数 key">
                            <button class="del" data-tplparamdel="">×</button>`
                        paramArea.insertBefore(row, addMoreEl)
                        renumberAdded()
                        const newInp = row.querySelector(".tpl-param-inp")
                        if (newInp) newInp.focus()
                    }
                })
            })

            // markdown_template — 整体确定
            document.querySelectorAll(`[data-confirm="markdown_template"]`).forEach(el => {
                el.addEventListener("click", () => {
                    const form = el.closest(".tpl-form")
                    // 收集所有参数：第一行在 tpl-form-row，其余在 tpl-param-row
                    const firstInp = form.querySelector(".tpl-form-row .tpl-param-inp")
                    const restInps = form.querySelectorAll(".tpl-param-row .tpl-param-inp")
                    const params = []
                    if (firstInp && firstInp.value.trim()) params.push(firstInp.value.trim())
                    restInps.forEach(inp => { if (inp.value.trim()) params.push(inp.value.trim()) })
                    if (!params.length) { toast("请至少填写一个参数 key"); return }

                    let botQQ
                    if (tplEditing && tplEditing !== "") {
                        botQQ = tplEditing
                    } else {
                        botQQ = getTplBotQQ()
                        if (!botQQ) { toast("请选择或填写机器人QQ"); return }
                    }
                    if (!state.maps.markdown_template) state.maps.markdown_template = {}
                    state.maps.markdown_template[botQQ] = params
                    tplEditing = null
                    render()
                })
            })

            // markdown_template — 整体取消
            document.querySelectorAll(`[data-cancel="markdown_template"]`).forEach(el => {
                el.addEventListener("click", () => {
                    tplEditing = null; render()
                })
            })

            // 普通字段 + 按钮 → 显示添加表单
            document.querySelectorAll("[data-add]").forEach(el => {
                el.addEventListener("click", () => {
                    const f = el.dataset.add
                    if (f === "markdown_template") {
                        tplEditing = ""; render()
                    } else {
                        document.querySelector(`[data-form="${f}"]`).classList.add("show")
                        el.style.display = "none"
                    }
                })
            })
            // 普通字段 取消按钮
            document.querySelectorAll("[data-cancel]").forEach(el => {
                const f = el.dataset.cancel
                if (f === "markdown_template") return // handled above
                el.addEventListener("click", () => {
                    if (textEditing && textEditing.field === f) {
                        textEditing = null; render(); return
                    }
                    document.querySelector(`[data-form="${f}"]`).classList.remove("show")
                    const addBox = document.querySelector(`[data-add="${f}"]`)
                    if (addBox) addBox.style.display = ""
                })
            })
            // 普通字段 确定按钮
            document.querySelectorAll("[data-confirm]").forEach(el => {
                const f = el.dataset.confirm
                if (f === "markdown_template") return // handled above
                el.addEventListener("click", () => {
                    const meta = MAP_META[f]
                    const inp = document.querySelector(`[data-botqqinp="${f}"]`)
                    const k = inp ? inp.value.trim() : ""
                    if (!k) { toast("请选择或填写机器人QQ"); return }

                    let v
                    if (meta.valueType === "bool") {
                        const cb = document.querySelector(`[data-formbool="${f}"]`)
                        v = cb ? cb.checked : false
                    } else {
                        const valInp = document.querySelector(`[data-formval="${f}"]`)
                        v = valInp ? valInp.value.trim() : ""
                        if (!v) { toast("请填写值"); return }
                    }
                    state.maps[f][k] = v
                    if (textEditing && textEditing.field === f) textEditing = null
                    render()
                })
            })

            initAllBotQQPickers()
        }

        async function load() {
            try {
                const r = await fetch(API)
                const d = await r.json()
                if (!d.ok) throw new Error(d.error || "加载失败")
                state = { bools: d.bools || {}, maps: d.maps || {}, numbers: d.numbers || {}, sandboxOn: !!d.sandboxOn }
                botQQList = d.botQQList || []
                render()
                document.getElementById("saveBtn").disabled = false
            } catch (e) {
                document.getElementById("content").innerHTML = `<div class="loading">加载失败：${esc(e.message)}</div>`
            }
        }

        document.getElementById("saveBtn").addEventListener("click", async () => {
            const btn = document.getElementById("saveBtn")
            btn.disabled = true
            try {
                const r = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ bools: state.bools, maps: state.maps, numbers: state.numbers }),
                })
                const d = await r.json()
                if (!d.ok) throw new Error(d.error || "保存失败")
                toast("已保存")
            } catch (e) {
                toast("保存失败：" + e.message)
            } finally {
                btn.disabled = false
            }
        })

        document.getElementById("restartBtn").addEventListener("click", async () => {
            if (!confirm("是否确认重启 Bot？")) return
            const btn = document.getElementById("restartBtn")
            btn.disabled = true
            try {
                const r = await fetch(WEB_BASE + "/api/qqbot-restart", { method: "POST" })
                const d = await r.json()
                if (!d.ok) throw new Error(d.error || "重启失败")
                toast("已发送重启指令")
            } catch (e) {
                toast("重启失败：" + e.message)
                btn.disabled = false
            }
        })

        load()
    </script>
</body>

</html>
